name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name Clipson
          --add-data "web;web"
          --collect-all yt_dlp
          --collect-all yt_dlp_ejs
          --hidden-import clr
          app.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md, README.en.md, LICENSE dist/Clipson/
          Compress-Archive -Path dist/Clipson -DestinationPath Clipson-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Clipson-windows
          path: Clipson-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Clipson-windows.zip
          generate_release_notes: true
